[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme", "hatchling" ]

[project]
name = "django-form-matrix"
version = "0.1.1"
description = """\
  A form field to fill a table of rows and columns, with a form field in every cell (checkboxes, numbers, choices...), \
  plus a ready-made permission matrix.\
  """
keywords = [ "admin", "checkbox", "django", "form", "grid", "matrix", "permissions", "widget" ]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
authors = [ { name = "Rodolfo Valentín Becerra García", email = "rodolvbg@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [ "django>=4.2" ]
optional-dependencies.dev = [
  "coverage[toml]>=7.4",
  "django-stubs[compatible-mypy]>=5",
  "django-unfold>=0.60",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "tox>=4",
  "tox-uv>=1",
  "unittest-parametrize>=1.9",
]
urls.Homepage = "https://github.com/rodolvbg/django-form-matrix"
urls.Issues = "https://github.com/rodolvbg/django-form-matrix/issues"
urls.Repository = "https://github.com/rodolvbg/django-form-matrix"

[dependency-groups]
dev = [
  "coverage[toml]>=7.4",
  "django-stubs[compatible-mypy]>=5",
  "django-unfold>=0.60",
  "mypy>=1.10",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-django>=4.8",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "tox>=4",
  "tox-uv>=1",
  "unittest-parametrize>=1.9",
]

[tool.hatch]
# PyPI's description: the README with its relative links (images, docs)
# made absolute, so they work outside GitHub too. HEAD is the repo's
# default branch, whatever its name.
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.targets.wheel.packages = [ "src/django_form_matrix" ]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)\s]+\.(?:png|jpe?g|gif|svg|webp))\)'
replacement = '](https://raw.githubusercontent.com/rodolvbg/django-form-matrix/HEAD/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:docs/|CHANGELOG|CONTRIBUTING|LICENSE)[^)\s]*)\)'
replacement = '](https://github.com/rodolvbg/django-form-matrix/blob/HEAD/\1)'

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [ "**/migrations/*.py" ]
lint.select = [
  "B",
  "DJ",
  "E",
  "F",
  "I",
  # flake8-type-checking
  "TC",
  "UP",
]
lint.ignore = [
  # runtime-cast-value
  # Forces quoting the type argument in typing.cast(), even when the type is a
  # normal runtime import. Purely stylistic, so we ignore it.
  "TC006",
]

[tool.mypy]
mypy_path = "src:example"
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [ "mypy_django_plugin.main" ]
overrides = [ { module = "unfold.*", ignore_missing_imports = true } ]

[tool.django-stubs]
django_settings_module = "example.settings"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src", "example", "." ]
ini_options.addopts = "--no-migrations --cov=django_form_matrix --cov-report=term-missing"
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.coverage]
run.branch = true
run.source = [ "django_form_matrix" ]
report.show_missing = true
report.skip_covered = true

[tool.tox]
env_list = [
  "py314-dj52",
  "py314-dj52-unfold",
  "py313-dj51",
  "py312-dj42",
  "py312-dj42-unfold",
  "py312-dj50",
  "py310-dj42",
  "py310-dj50",
  "py310-dj51",
  "py310-dj52",
]
# --no-cov: the environments run in parallel, and would share one .coverage.
env_run_base.commands = [ [ "pytest", "tests", "--ignore=tests/e2e", "--no-cov", "{posargs}" ] ]
env_run_base.deps = [
  "pytest",
  "pytest-django",
  "pytest-cov",
  "unittest-parametrize",
  { replace = "if", condition = "factor.dj42", then = [ "django>=4.2,<4.3" ], extend = true },
  { replace = "if", condition = "factor.dj50", then = [ "django>=5.0,<5.1" ], extend = true },
  { replace = "if", condition = "factor.dj51", then = [ "django>=5.1,<5.2" ], extend = true },
  { replace = "if", condition = "factor.dj52", then = [ "django>=5.2,<5.3" ], extend = true },
  { replace = "if", condition = "factor.unfold", then = [ "django-unfold>=0.60" ], extend = true },
]
env_run_base.package = "wheel"
env_run_base.wheel_build_env = ".pkg"
